<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Table</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="table">
        <table>
            <th></th>
            <th class="col">Monday</th>
            <th class="col">Tuesday</th>
            <th class="col">Wednesday</th>
            <th class="col">Thursday</th>
            <th class="col">Friday</th>
            <tr class="sharp">
                <th class="time">08:00</th>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-3"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
            </tr>
            <tr class="half">
                <th class="time">09:00</th>
                <td class="available-4"></td>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-5"></td>
                <td class="available-2"></td>
            </tr>
            <tr class="sharp">
                <th class="time">10:00</th>
                <td class="available-2"></td>
                <td class="available-4"></td>
                <td class="available-2"></td>
                <td class="available-5"></td>
                <td class="available-2"></td>
            </tr>
            <tr class="half">
            <th class="time">11:00</th>
                <td class="available-3"></td>
                <td class="available-4"></td>
                <td class="available-2"></td>
                <td class="available-5"></td>
                <td class="available-2"></td>
            </tr>
            <tr class="sharp">
                <th class="time">12:00</th>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-2"></td>
            </tr>
            <tr class="half">
                <th class="time">13:00</th>
                <td class="available-1"></td>
                <td class="available-1"></td>
                <td class="available-2"></td>
                <td class="available-4"></td>
                <td class="available-1"></td>
            </tr>
            <tr class="sharp">
                <th class="time">14:00</th>
                <td class="available-0"></td>
                <td class="available-0"></td>
                <td class="available-0"></td>
                <td class="available-0"></td>
                <td class="available-0"></td>
            </tr>
            <tr class="half">
                <th class="time">15:00</th>
                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-2"></td>
                <td class="available-5"></td>
                <td class="available-0"></td>
            </tr>
            <tr class="sharp">
                <th class="time">16:00</th>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-3"></td>
                <td class="available-5"></td>
                <td class="available-0"></td>
            </tr>
            <tr class="half">
                <th class="time">17:00</th>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-3"></td>
                <td class="available-5"></td>
                <td class="available-0"></td>
            </tr>
        </table>
        
    </div>
    <div id="legend">
        <span>Availability</span><br>
        <div class="legend-scale">
            <div class="legend-label">0</div>
            <div id="legend-gradient"></div>
            <div class="legend-label">5</div>
        </div>
    </div>
</body>

</html>
